name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: fmt
        run: tofu fmt -check -recursive

      - name: init
        run: tofu init -backend=false

      - name: validate
        run: tofu validate

      # mock_provider requires OpenTofu/Terraform >= 1.7; the module itself only
      # needs >= 1.5, so this is a test-time requirement, not a consumer one.
      - name: test
        run: tofu test

      - name: validate example
        working-directory: examples/basic
        run: |
          tofu init -backend=false
          tofu validate
